<svg xmlns="http://www.w3.org/2000/svg" width="200" height="28" viewBox="0 0 200 28">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141d36"/>
      <stop offset="100%" stop-color="#0f1629"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Left section: label -->
  <rect x="0" y="0" width="80" height="28" rx="4" fill="#1e2a45"/>
  <text x="40" y="19" text-anchor="middle" fill="#8892b0" font-family="Verdana, sans-serif" font-size="10" font-weight="600">Powered by</text>
  <!-- Right section: brand -->
  <rect x="80" y="0" width="120" height="28" rx="4" fill="url(#bg)" stroke="url(#accent)" stroke-width="1"/>
  <text x="140" y="19" text-anchor="middle" fill="#10b981" font-family="Verdana, sans-serif" font-size="11" font-weight="700">Token Efficiency</text>
  <!-- Rounded corners on right -->
  <path d="M 196 0 L 196 28" stroke="url(#accent)" stroke-width="1" fill="none"/>
</svg>
