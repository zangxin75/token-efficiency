[project]
name = "tokeneff"
version = "0.1.0"
description = "LLM API cost meter - optimize your LLM spending"
authors = [{name = "Token Efficiency", email = "dev@tokeneff.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["llm", "api", "cost", "meter", "optimization", "token"]

dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "rich>=13.0.0",
    "keyring>=25.0",
    "keyrings.alt>=5.0",  # keyring file backend fallback when no DBus / desktop environment
    "questionary>=2.0.0",
    "tomlkit>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
tokeneff = "tokeneff.cli:main"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tokeneff*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
